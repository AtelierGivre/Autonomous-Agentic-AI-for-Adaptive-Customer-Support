name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint + tests + offline eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests
        run: pytest -q

      - name: Offline quality gate
        env:
          LLM_PROVIDER: mock
          EMBEDDING_BACKEND: hash
          MIN_RETRIEVAL_SCORE: "0.1"
          MIN_LEXICAL_COVERAGE: "0.5"
          ENVIRONMENT: development
          DEBUG_RESPONSES: "true"
          DEFAULT_CUSTOMER_ID: demo
          API_KEYS: ""
        run: python -m evals.run_evals --min-pass 0.9

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: evals/report.json
          if-no-files-found: ignore
