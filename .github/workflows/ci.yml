name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint + tests + offline eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests
        run: pytest -q

      - name: Offline quality gate
        env:
          LLM_PROVIDER: mock
          EMBEDDING_BACKEND: hash
          MIN_RETRIEVAL_SCORE: "0.1"
          MIN_LEXICAL_COVERAGE: "0.5"
          ENVIRONMENT: development
          DEBUG_RESPONSES: "true"
          DEFAULT_CUSTOMER_ID: demo
          API_KEYS: ""
        run: python -m evals.run_evals --min-pass 0.9

      - name: Retrieval quality gate
        env:
          EMBEDDING_BACKEND: hash
          VECTOR_STORE: builtin
          INGEST_BACKEND: builtin
        run: python -m evals.run_retrieval --min-recall 0.8

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: |
            evals/report.json
            evals/retrieval_report.json
          if-no-files-found: ignore

  rag-backends:
    name: optional FAISS + LlamaIndex backends (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime, dev and optional RAG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-rag.txt

      - name: Lint
        run: ruff check .

      - name: Tests with FAISS + LlamaIndex enabled
        env:
          EMBEDDING_BACKEND: hash
          VECTOR_STORE: faiss
          INGEST_BACKEND: llamaindex
          INDEX_DIR: ${{ runner.temp }}/agent-index
        run: pytest -q

      - name: Retrieval parity with optional backends
        env:
          EMBEDDING_BACKEND: hash
          VECTOR_STORE: faiss
          INGEST_BACKEND: llamaindex
          INDEX_DIR: ${{ runner.temp }}/agent-index
        run: python -m evals.run_retrieval --min-recall 0.8

      - name: Vector-store benchmark
        run: python -m evals.benchmark_rag --backend faiss --sizes 1000,10000 --queries 10

      - name: Upload RAG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-reports
          path: |
            evals/retrieval_report.json
            evals/benchmark_report.json
          if-no-files-found: ignore
